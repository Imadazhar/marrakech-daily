name: "✏️ Manual Publish — Marrakech Daily"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic — e.g. "New luxury hotel opens in Marrakech"'
        required: true
        default: ""
      category:
        description: "Category"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - Breaking
          - National
          - Business
          - Sport
          - Culture
          - Tourism
          - Society
          - Tech
          - Health
          - World

permissions:
  contents: write

jobs:
  manual-publish:
    name: "Manual article: ${{ inputs.topic }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "⬇ Checkout main"
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: "🐍 Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: "📦 Install dependencies"
        run: pip install -r agent/requirements.txt

      - name: "✏️ Generate article"
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH:     ${{ github.workspace }}
        run: |
          CATEGORY_ARG=""
          if [ "${{ inputs.category }}" != "auto" ]; then
            CATEGORY_ARG="--category '${{ inputs.category }}'"
          fi
          cd agent && python manual_publish.py --topic "${{ inputs.topic }}" $CATEGORY_ARG

      - name: "💾 Commit to main"
        run: |
          git config user.name  "Marrakech Daily Bot 🤖"
          git config user.email "bot@marrakechdaily.github"
          git add index.html _data/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "✏️ Manual: ${{ inputs.topic }}"
            git push origin main
          fi

      - name: "🚀 Sync to gh-pages"
        run: |
          git config user.name  "Marrakech Daily Bot 🤖"
          git config user.email "bot@marrakechdaily.github"
          cp index.html /tmp/manual_index.html
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/manual_index.html index.html
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "✏️ Manual article: ${{ inputs.topic }}"
            git push origin gh-pages
            echo "✅ Live site updated"
          fi

      - name: "📊 Upload logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "manual-logs-${{ github.run_id }}"
          path: agent/logs/
          retention-days: 7
