name: Manual Publish — Marrakech Daily

on:
  workflow_dispatch:
    inputs:
      headline:
        description: |
          Article headline or topic to publish.
          Examples:
            "New luxury hotel opens in Marrakech"
            "Marrakech airport expansion"
            "Morocco advances in FIFA World Cup"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-article:
    name: Publish Article from Headline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      # ── 3. Install dependencies ──────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r agent/requirements.txt

      # ── 4. Generate and publish article ──────────────────────────
      - name: Generate article from headline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Pass user input via env var — NEVER inline in run: scripts to avoid injection
          ARTICLE_HEADLINE: ${{ github.event.inputs.headline }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd ${{ github.workspace }}
          python agent/manual_publish.py "$ARTICLE_HEADLINE"

      # ── 5. Commit and push ────────────────────────────────────────
      - name: Commit and push
        env:
          ARTICLE_HEADLINE: ${{ github.event.inputs.headline }}
        run: |
          git config --global user.name  "Marrakech Daily Bot"
          git config --global user.email "bot@marrakechdaily.github"

          git add index.html _data/articles.json _data/published_hashes.json

          if git diff --cached --quiet; then
            echo "No changes detected — article may have been a duplicate."
            exit 1
          fi

          # Headline comes from env var, not inline interpolation
          git commit -m "📰 Manual publish: \"$ARTICLE_HEADLINE\" [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push

      # ── 6. Upload log ─────────────────────────────────────────────
      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-publish-log-${{ github.run_id }}
          path: agent/logs/
          retention-days: 7
