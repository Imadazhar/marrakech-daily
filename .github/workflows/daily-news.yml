name: "📰 Marrakech Daily — AI News Agent"

on:
  schedule:
    - cron: "0 5 * * *"   # 06:00 Africa/Casablanca (UTC+1 summer / UTC winter)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max articles to publish"
        required: false
        default: "20"
      dry_run:
        description: "Dry run — generate but do not commit"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: "Editorial AI Agent"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "Checkout main (agent lives here)"
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: "Install dependencies"
        run: pip install -r agent/requirements.txt

      - name: "Run editorial agent"
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          AGENT_LIMIT:   ${{ github.event.inputs.limit || '20' }}
          AGENT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$AGENT_DRY_RUN" = "true" ]; then
            python agent/main.py --limit "$AGENT_LIMIT" --dry-run
          else
            python agent/main.py --limit "$AGENT_LIMIT"
          fi

      - name: "Commit to main"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "Marrakech Daily Bot 🤖"
          git config user.email "bot@marrakechdaily.github"
          git add index.html _data/ agent/logs/ || true
          if git diff --cached --quiet; then
            echo "Nothing new on main"
          else
            git commit -m "📰 Daily update $(date -u +'%Y-%m-%d') — AI-generated articles"
            git push origin main
          fi

      - name: "Sync index.html to gh-pages (live site)"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "Marrakech Daily Bot 🤖"
          git config user.email "bot@marrakechdaily.github"

          # Stash the updated index.html
          cp index.html /tmp/updated_index.html

          # Switch to gh-pages
          git fetch origin gh-pages
          git checkout gh-pages

          # Copy the updated index.html from main
          cp /tmp/updated_index.html index.html

          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to sync"
          else
            git commit -m "📰 Sync daily articles to live site $(date -u +'%Y-%m-%d')"
            git push origin gh-pages
          fi

      - name: "Upload agent logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "agent-logs-${{ github.run_id }}"
          path: agent/logs/
          retention-days: 14

