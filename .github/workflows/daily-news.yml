name: "📰 Marrakech Daily — AI News Agent"

on:
  # Every day at 05:00 UTC = 06:00 Africa/Casablanca (UTC+1 summer)
  schedule:
    - cron: "0 5 * * *"

  workflow_dispatch:
    inputs:
      limit:
        description: "Max articles to publish (default 30)"
        required: false
        default: "30"
      dry_run:
        description: "Dry run — generate but do not commit"
        required: false
        type: boolean
        default: false
      sources:
        description: "Comma-separated source IDs to run (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    name: "Editorial AI Agent"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "⬇ Checkout main"
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: "🐍 Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: "📦 Install dependencies"
        run: pip install -r agent/requirements.txt

      - name: "📰 Run editorial agent"
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH:     ${{ github.workspace }}
        run: |
          ARGS="--limit ${{ inputs.limit || '30' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.sources }}" ]; then
            ARGS="$ARGS --sources $(echo '${{ inputs.sources }}' | tr ',' ' ')"
          fi
          cd agent && python main.py $ARGS

      - name: "💾 Commit to main"
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "Marrakech Daily Bot 🤖"
          git config user.email "bot@marrakechdaily.github"
          git add index.html _data/ agent/logs/ || true
          if git diff --cached --quiet; then
            echo "ℹ Nothing new on main"
          else
            git commit -m "📰 Daily update $(date -u +'%Y-%m-%d') — AI-generated articles"
            git push origin main
            echo "✅ main updated"
          fi

      - name: "🚀 Sync to gh-pages (live site)"
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "Marrakech Daily Bot 🤖"
          git config user.email "bot@marrakechdaily.github"

          # Save the updated index.html
          cp index.html /tmp/new_index.html

          # Switch to gh-pages
          git fetch origin gh-pages
          git checkout gh-pages

          # Apply update
          cp /tmp/new_index.html index.html

          git add index.html
          if git diff --cached --quiet; then
            echo "ℹ No index.html changes to sync"
          else
            git commit -m "📰 Live update $(date -u +'%Y-%m-%d')"
            git push origin gh-pages
            echo "✅ gh-pages updated — site is live"
          fi

      - name: "📊 Upload logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "agent-logs-${{ github.run_id }}"
          path: agent/logs/
          retention-days: 14
