name: Daily News — Marrakech Daily AI Agent

on:
  # Every day at 05:00 UTC = 06:00 Morocco time (UTC+1, year-round)
  schedule:
    - cron: "0 5 * * *"

  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of articles to publish"
        required: false
        default: "20"
      dry_run:
        description: "Dry run (scrape + generate but do NOT commit)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-agent:
    name: Editorial AI Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      # ── 3. Install dependencies ──────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r agent/requirements.txt

      # ── 4. Run the agent ─────────────────────────────────────────
      - name: Run editorial agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          # Use numeric/boolean env vars — no user-controlled strings here
          AGENT_LIMIT: ${{ github.event.inputs.limit || '20' }}
          AGENT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          cd ${{ github.workspace }}
          if [ "$AGENT_DRY_RUN" = "true" ]; then
            python agent/main.py --limit "$AGENT_LIMIT" --dry-run
          else
            python agent/main.py --limit "$AGENT_LIMIT"
          fi

      # ── 5. Commit & push (skip on dry run) ───────────────────────
      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name  "Marrakech Daily Bot"
          git config --global user.email "bot@marrakechdaily.github"

          git add index.html _data/articles.json _data/published_hashes.json

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No new articles published — nothing to commit."
          else
            ARTICLE_COUNT=$(python -c "
          import json
          try:
            arts = json.loads(open('_data/articles.json').read())
            today = [a for a in arts if a.get('date_display','').endswith('$(date +%Y)')]
            print(len(today))
          except:
            print('?')
          ")
            git commit -m "📰 Daily update — ${ARTICLE_COUNT} new articles published [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      # ── 6. Upload log as artifact ─────────────────────────────────
      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: agent/logs/
          retention-days: 7
