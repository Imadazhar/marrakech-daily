name: "📰 Marrakech Daily — AI News Agent"

on:
  # Every day at 05:00 UTC = 06:00 Africa/Casablanca (GMT+1 summer, GMT winter)
  schedule:
    - cron: "0 5 * * *"

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - manual
      topic:
        description: "Manual article topic (manual mode only)"
        required: false
        default: ""
      limit:
        description: "Number of articles (daily mode)"
        required: false
        default: "30"
      sources:
        description: "Comma-separated source IDs to use (leave blank for all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    name: "Publish news"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "⬇ Checkout gh-pages"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: "📦 Install dependencies"
        run: pip install -r agent/requirements.txt

      - name: "📰 Daily run"
        if: github.event_name == 'schedule' || inputs.mode == 'daily'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          SOURCES_FLAG=""
          if [ -n "${{ inputs.sources }}" ]; then
            # Convert comma-separated to space-separated --sources args
            SOURCES_FLAG="--sources $(echo '${{ inputs.sources }}' | tr ',' ' ')"
          fi
          python agent/daily_agent.py \
            --limit ${{ inputs.limit || 30 }} \
            $SOURCES_FLAG

      - name: "✏️ Manual article"
        if: inputs.mode == 'manual' && inputs.topic != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python agent/daily_agent.py --manual "${{ inputs.topic }}"

      - name: "📤 Commit & push"
        run: |
          git config user.name  "Marrakech Daily Bot 🤖"
          git config user.email "bot@marrakechdaily.com"

          git add index.html articles/ sitemap.xml feed.xml logs/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TODAY=$(date +'%Y-%m-%d')
          MODE="${{ inputs.mode || 'daily' }}"

          if [ "$MODE" = "manual" ]; then
            MSG="📰 Manual: ${{ inputs.topic || 'article' }} (${TODAY})"
          else
            MSG="📰 Daily update ${TODAY} — AI-generated Marrakech news"
          fi

          git commit -m "$MSG"
          git push origin gh-pages
          echo "✅ Pushed to GitHub Pages"

      - name: "📊 Upload logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "agent-logs-${{ github.run_id }}"
          path: logs/
          retention-days: 30
